name: Auto Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make API call with GITHUB_TOKEN
        run: |
          curl -X POST https://api.github.com/repos/${{ github.repository }}/issues \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"title":"Issue triggered by GitHub Actions","body":"Automated deployment triggered"}'

- name: Crear issue si falla el CI
  if: failure()
  uses: peter-evans/create-issue-from-file@v4
  with:
    title: "❌ Fallo crítico en CI"
    content-filepath: summary.md
    labels: bug, CI
