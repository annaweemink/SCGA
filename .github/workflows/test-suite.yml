name: CI - Ejecutar Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Ejecutar Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Ejecutar pruebas
        run: |
          mkdir -p test_logs
          chmod +x tests/*.sh
          touch test_results.md
          for test_script in tests/*.sh; do
            echo "### Ejecutando $test_script" >> test_results.md
            if bash "$test_script" >> test_logs/$(basename "$test_script").log 2>&1; then
              echo "✅ $test_script pasó" >> test_results.md
            else
              echo "❌ Falló: $test_script" >> test_results.md
            fi
            echo "" >> test_results.md
          done

      - name: Generar reporte final
        run: |
          echo "### Resultados de las pruebas" > summary.md
          echo "" >> summary.md
          cat test_results.md >> summary.md

      - name: Mostrar resumen en GitHub UI
        run: |
          echo "### Resultado de pruebas CI" >> $GITHUB_STEP_SUMMARY
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Verificar archivos generados
        run: ls -alh

      - name: Subir reporte de pruebas
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            summary.md
            test_logs/
